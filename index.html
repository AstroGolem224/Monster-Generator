<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monster Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <!-- Background Effects -->
    <canvas id="ember-canvas"></canvas>
    <div class="scanlines"></div>
    <div class="noise-overlay"></div>
    <header class="header" role="banner">
      <h1 class="header__title">MONSTER GENERATOR</h1>
      <p class="header__subtitle">build // forge // create</p>
    </header>

    <main class="main" role="main">
      <aside class="picker" aria-label="Monsterteile auswählen">
        <div class="picker__tabs" id="categoryTabs" role="tablist"></div>
        <div class="picker__locks" id="categoryLocks" aria-label="Kategorie-Sperren"></div>
        <div class="picker__seed-tools" aria-label="Seeded Randomizer">
          <label class="picker__seed-label" for="seedInput">Seed</label>
          <input type="text" id="seedInput" class="picker__seed-input" placeholder="z. B. DRUID-001" />
          <div class="picker__seed-actions">
            <button type="button" class="picker__random" id="randomBtnPicker" aria-label="Zufälliges Monster mit Seed erzeugen">Seed-Randomizer</button>
            <button type="button" class="preview__btn preview__btn--secondary preview__btn--small" id="newSeedBtn">Neuer Seed</button>
          </div>
          <p class="picker__seed-hint">Gelockte Kategorien bleiben erhalten. Ungelockte Kategorien werden deterministisch über den Seed neu gewürfelt.</p>
        </div>
        <div class="picker__grid" id="partsGrid"></div>
      </aside>
      <section class="preview" aria-label="Monster-Vorschau">
        <div class="preview__canvas-wrap">
          <div class="preview__frame">
            <canvas id="previewCanvas" width="400" height="400" aria-label="Zusammengesetztes Monster"></canvas>
          </div>
        </div>
        <div id="scalerPanel" class="scaler-panel" hidden aria-label="Größe, Drehung und Spiegelung des ausgewählten Teils">
          <p class="scaler-panel__title">Ausgewähltes Teil</p>
          <label class="scaler-panel__label">Größe <span id="scaleValue">100</span>% (50–400)</label>
          <input type="range" id="scaleSlider" class="scaler-panel__slider" min="50" max="400" value="100" step="5" aria-label="Größe" />
          <label class="scaler-panel__label">Drehung <span id="rotationValue">0</span>°</label>
          <input type="range" id="rotationSlider" class="scaler-panel__slider" min="0" max="360" value="0" step="5" aria-label="Drehung" />
          <div class="scaler-panel__mirror">
            <button type="button" id="mirrorHBtn" class="preview__btn preview__btn--small" aria-label="Horizontal spiegeln">↔ Horizontal</button>
            <button type="button" id="mirrorVBtn" class="preview__btn preview__btn--small" aria-label="Vertikal spiegeln">↕ Vertikal</button>
          </div>
          <div class="scaler-panel__align">
            <button type="button" id="alignCenterXBtn" class="preview__btn preview__btn--secondary preview__btn--small" aria-label="Horizontal zentrieren">↔ Center X</button>
            <button type="button" id="alignCenterYBtn" class="preview__btn preview__btn--secondary preview__btn--small" aria-label="Vertikal zentrieren">↕ Center Y</button>
          </div>
          <div class="scaler-panel__precision">
            <button type="button" id="snapToggleBtn" class="preview__btn preview__btn--secondary preview__btn--small" aria-pressed="false">Snap Grid</button>
            <button type="button" id="guidesToggleBtn" class="preview__btn preview__btn--secondary preview__btn--small" aria-pressed="false">Symmetry Guides</button>
          </div>
          <button type="button" id="trashBtn" class="preview__btn preview__btn--trash" disabled aria-label="Ausgewähltes Teil löschen" title="Ausgewähltes Teil vom Canvas entfernen">
            <svg class="btn-trash-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            Teil löschen
          </button>
        </div>
        <section id="layersPanel" class="layers-panel" aria-label="Ebenen verwalten">
          <div class="layers-panel__header">
            <p class="layers-panel__title">Ebenen</p>
            <input type="text" id="layerNameInput" class="layers-panel__name-input" placeholder="Name des ausgewählten Teils" disabled />
          </div>
          <div class="layers-panel__controls">
            <button type="button" class="preview__btn preview__btn--secondary preview__btn--small" id="layerMoveTopBtn">Ganz nach vorn</button>
            <button type="button" class="preview__btn preview__btn--secondary preview__btn--small" id="layerMoveUpBtn">Nach vorn</button>
            <button type="button" class="preview__btn preview__btn--secondary preview__btn--small" id="layerMoveDownBtn">Nach hinten</button>
            <button type="button" class="preview__btn preview__btn--secondary preview__btn--small" id="layerMoveBottomBtn">Ganz nach hinten</button>
          </div>
          <ul id="layersList" class="layers-panel__list"></ul>
        </section>
        <div class="preview__actions">
          <button type="button" class="preview__btn preview__btn--secondary preview__btn--history" id="undoBtn" disabled aria-label="Letzte Aktion rückgängig machen">↶ Undo</button>
          <button type="button" class="preview__btn preview__btn--secondary preview__btn--history" id="redoBtn" disabled aria-label="Zuletzt rückgängig gemachte Aktion wiederherstellen">↷ Redo</button>
          <button type="button" class="preview__btn preview__btn--secondary" id="mutateBtn">Mutate</button>
          <button type="button" class="preview__btn preview__btn--secondary" id="evolveBtn">Evolve</button>
          <button type="button" class="preview__btn preview__btn--secondary" id="corruptBtn">Corrupt</button>
          <button type="button" class="preview__btn preview__btn--secondary" id="bossBtn">Bossify</button>
          <button type="button" class="preview__btn preview__btn--random" id="randomBtn">Zufälliges Monster</button>
          <button type="button" class="preview__export" id="exportBtn">Als PNG herunterladen</button>
        </div>
        <p id="historyStatus" class="preview__history-status" aria-live="polite">History 1/1</p>
        <div class="preview__presets" aria-label="Presets">
          <div class="presets__save">
            <label for="presetName" class="presets__label">Preset-Name</label>
            <input type="text" id="presetName" class="presets__input" placeholder="z. B. Blau" maxlength="30" />
            <button type="button" class="preview__btn" id="savePresetBtn">Preset speichern</button>
          </div>
          <div class="presets__load">
            <label for="presetSelect" class="presets__label">Gespeicherte Presets</label>
            <select id="presetSelect" class="presets__select" aria-label="Preset auswählen">
              <option value="">– auswählen –</option>
            </select>
            <div class="presets__load-btns">
              <button type="button" class="preview__btn" id="loadPresetBtn">Preset laden</button>
              <button type="button" class="preview__btn preview__btn--secondary" id="deletePresetBtn">Preset löschen</button>
              <button type="button" class="preview__btn preview__btn--secondary" id="renamePresetBtn">Umbenennen</button>
              <button type="button" class="preview__btn preview__btn--secondary" id="duplicatePresetBtn">Duplizieren</button>
              <button type="button" class="preview__btn preview__btn--secondary" id="exportPresetBtn">Preset JSON</button>
            </div>
          </div>
          <div id="presetGallery" class="preset-gallery" aria-label="Preset-Galerie"></div>
          <div class="presets__import">
            <label for="presetImportTextarea" class="presets__label">Preset JSON importieren / exportieren</label>
            <textarea id="presetImportTextarea" class="presets__textarea" placeholder="Preset-JSON hier einfügen oder exportiertes JSON anzeigen"></textarea>
            <button type="button" class="preview__btn preview__btn--secondary" id="importPresetBtn">Preset importieren</button>
          </div>
        </div>
        <section class="decor-panel" aria-label="Hintergründe, Rahmen und Sticker">
          <p class="decor-panel__title">Decor Layers</p>
          <label for="backgroundSelect" class="presets__label">Background</label>
          <select id="backgroundSelect" class="presets__select"></select>
          <label for="frameSelect" class="presets__label">Frame</label>
          <select id="frameSelect" class="presets__select"></select>
          <label for="stickerSelect" class="presets__label">Sticker</label>
          <select id="stickerSelect" class="presets__select"></select>
          <label for="titleInput" class="presets__label">Nametag / Title</label>
          <input type="text" id="titleInput" class="presets__input" maxlength="24" placeholder="z. B. Boss Slime" />
        </section>
        <div class="share-panel" aria-label="Monster teilen">
          <p class="share-panel__title">Monster Codes &amp; Share Links</p>
          <textarea id="shareCodeOutput" class="share-panel__textarea" readonly placeholder="Share-Code generieren"></textarea>
          <div class="share-panel__actions">
            <button type="button" class="preview__btn" id="generateShareCodeBtn">Share-Code erzeugen</button>
            <button type="button" class="preview__btn preview__btn--secondary" id="copyShareCodeBtn">Code kopieren</button>
            <button type="button" class="preview__btn preview__btn--secondary" id="copyShareLinkBtn">Link kopieren</button>
          </div>
          <textarea id="shareCodeInput" class="share-panel__textarea" placeholder="Share-Code einfügen"></textarea>
          <button type="button" class="preview__btn preview__btn--secondary" id="loadShareCodeBtn">Monster aus Code laden</button>
        </div>
        <button type="button" class="preview__btn preview__btn--secondary" id="resetBtn">Zurücksetzen</button>
      </section>
    </main>
    <div id="liveRegion" class="live-region" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
